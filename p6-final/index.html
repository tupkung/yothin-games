<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ป.6 ทบทวนสอบปลายภาค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--ink:#1a1c1e;--muted:#5b6167;--line:#dfe3e8;--bg:#fbfbfa;--card:#fff;--soft:#f4f6f8;
--accent:#1f6feb;--ok:#136c39;--ok-bg:#e8f6ee;--bad:#b3261e;--bad-bg:#fdecea;
--en:#1f6feb;--ma:#b25000;--th:#6b46e0;--sc:#136c39;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{
--ink:#e6e8ea;--muted:#9aa2ab;--line:#333a42;--bg:#16181b;--card:#1e2126;--soft:#262a30;
--accent:#69a4ff;--ok:#6fd39a;--ok-bg:#13301f;--bad:#ff8a80;--bad-bg:#3a1a17;
--en:#69a4ff;--ma:#f0a163;--th:#a68cff;--sc:#6fd39a;--on-accent:#0b1a33}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",-apple-system,sans-serif;font-size:18px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px calc(60px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.hidden{display:none !important}
button{font-family:inherit;font-size:1rem;cursor:pointer;touch-action:manipulation}
.subj{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.subj b{font-size:1.15rem}
.subj .d{color:var(--muted);font-size:.86rem}
.t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.t .best{float:right;font-size:.8rem;color:var(--ok);font-weight:700}
.t .d{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.hud{display:flex;gap:10px;margin-bottom:12px}
.pill{flex:1;background:var(--soft);border-radius:11px;padding:6px;text-align:center;line-height:1.3}
.pill .n{font-size:1.25rem;font-weight:700;font-family:"IBM Plex Mono",monospace}
.pill .l{font-size:.72rem;color:var(--muted)}
.q{font-size:1.15rem;font-weight:600;margin:4px 0 14px;white-space:pre-line}
.ch{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)}
.ch.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:10px 14px;margin:4px 0 12px;font-size:.96rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.go{display:block;width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px;font-weight:700}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.88rem}
.big{font-size:2.4rem;font-weight:700;text-align:center}
.stars{font-size:2rem;text-align:center}
.miss{font-size:.9rem;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
  <h1>⭐ ป.6 ทบทวนสอบปลายภาค</h1>
  <p class="sub">ภาคเรียนที่ 1/2569 · สอบศุกร์ 16 ต.ค. · เลือกวิชา แล้วเลือกหัวข้อ · รอบละ 10 ข้อ ผิดข้อไหนมีคำอธิบาย</p>
  <div id="subjects"></div>
</section>
<section id="topics" class="hidden">
  <h1 id="sTitle"></h1><p class="sub" id="sSub"></p>
  <div id="topicList"></div>
  <p style="text-align:center"><button class="ghost" id="backHome">← เลือกวิชาอื่น</button></p>
</section>
<section id="play" class="hidden">
  <div class="hud">
    <div class="pill"><div class="n" id="hNo">1</div><div class="l" id="hOf">ข้อ / 10</div></div>
    <div class="pill"><div class="n" id="hOk">0</div><div class="l">ถูก</div></div>
    <div class="pill"><div class="n" id="hStreak">0</div><div class="l">ถูกติดกัน 🔥</div></div>
  </div>
  <div class="card">
    <div class="sub" id="tName" style="margin:0 0 4px"></div>
    <div class="q" id="q"></div>
    <div id="choices"></div>
    <div id="fb"></div>
    <button class="go hidden" id="next">ข้อต่อไป →</button>
  </div>
  <p style="text-align:center;margin-top:12px"><button class="ghost" id="quit">← กลับ</button></p>
</section>
<section id="done" class="hidden">
  <div class="card">
    <h1 id="dTitle"></h1>
    <div class="stars" id="dStars"></div>
    <div class="big" id="dScore"></div>
    <p style="text-align:center;color:var(--muted)" id="dMsg"></p>
    <div id="dMiss"></div>
    <button class="go" id="again">เล่นอีกรอบ</button>
    <p style="text-align:center;margin-top:10px"><button class="ghost" id="toTopics">← เลือกหัวข้อ</button></p>
  </div>
</section>
<footer>เกมทบทวน ป.6 · ข้อในเกมแต่งใหม่ตามหัวข้อในตารางสอบ (คำศัพท์ LFO ไม่มีในเกม — ทบทวนจากหนังสือ) · สถิติเก็บในเครื่องนี้</footer>
</main>

const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const fmt = n => n.toLocaleString('en-US');
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function numChoices(ans, cands) { const s = [ans]; for (const c of cands) if (c > 0 && Number.isInteger(c) && !s.includes(c)) s.push(c); let k = 1; while (s.length < 4) { const v = ans + k * (k % 2 ? 10 : -1); if (v > 0 && !s.includes(v)) s.push(v); k++; } return s.slice(0, 4).map(fmt); }
/* ตัวเลขของชุดวัดที่ยังไม่ทำ (math rp-01 · rp-02B) — ห้ามเกมสุ่มออกมาซ้ำ */

function safe(gen) { for (let k = 0; k < 50; k++) { const q = gen(); if (!RESERVED.test(q[0])) return q; } return gen(); }

function genDiagram() {
  const t = R(1, 4);
  if (t === 1) {
    const both = R(4, 12), a = both + R(8, 20), b = both + R(6, 18), none = R(2, 9), tot = a + b - both + none;
    return ['นักเรียน ' + tot + ' คน ชอบฟุตบอล ' + a + ' คน ชอบบาสเกตบอล ' + b + ' คน ชอบทั้งสองอย่าง ' + both + ' คน มีนักเรียนที่ไม่ชอบทั้งสองอย่างกี่คน\n(วาดแผนภาพวงกลมซ้อนกัน 2 วง)', numChoices(none, [none + both, a + b - both, tot - a]), 'ชอบอย่างน้อย 1 อย่าง = ' + a + ' + ' + b + ' − ' + both + ' (ตรงกลางถูกนับ 2 ครั้ง) = ' + (a + b - both) + ' · ไม่ชอบเลย = ' + tot + ' − ' + (a + b - both) + ' = ' + none + ' คน'];
  }
  if (t === 2) {
    const both = R(5, 15), onlyA = R(6, 20), b = both + R(5, 20);
    return ['ในห้องเรียน มีนักเรียนเรียนดนตรี ' + (onlyA + both) + ' คน เรียนว่ายน้ำ ' + b + ' คน เรียนทั้งสองอย่าง ' + both + ' คน มีนักเรียนที่เรียนดนตรีเพียงอย่างเดียวกี่คน', numChoices(onlyA, [onlyA + both, b - both, onlyA + both + b]), 'ดนตรีเพียงอย่างเดียว = เรียนดนตรีทั้งหมด − เรียนทั้งสองอย่าง = ' + (onlyA + both) + ' − ' + both + ' = ' + onlyA + ' คน · อ่านคำว่า "เพียงอย่างเดียว" ให้ดี'];
  }
  if (t === 3) {
    const diff = R(3, 15) * 10, small = R(10, 40) * 10, big = small + diff, sum = big + small;
    return ['เอมีเงินมากกว่าบีม ' + diff + ' บาท ทั้งสองคนมีเงินรวมกัน ' + fmt(sum) + ' บาท เอมีเงินกี่บาท\n(วาดแผนภาพแท่ง: แท่งเอยาวกว่าแท่งบีม ' + diff + ')', numChoices(big, [small, sum / 2, sum - diff]), 'ตัดส่วนที่เกินออก: ' + fmt(sum) + ' − ' + diff + ' = ' + fmt(2 * small) + ' = 2 แท่งเท่ากัน → บีม = ' + small + ' · เอ = ' + small + ' + ' + diff + ' = ' + big + ' บาท (ถามเอ ไม่ใช่บีม!)'];
  }
  const u = R(4, 15) * 10, k = R(2, 4), sum = u * (k + 1);
  return ['ส้มมีลูกแก้วเป็น ' + k + ' เท่าของแก้ม รวมกันมี ' + sum + ' ลูก ส้มมีลูกแก้วกี่ลูก\n(วาดแท่ง: แก้ม 1 ส่วน ส้ม ' + k + ' ส่วน)', numChoices(u * k, [u, sum / k, u * (k + 1)]), 'รวม ' + (k + 1) + ' ส่วน = ' + sum + ' → 1 ส่วน = ' + sum + ' ÷ ' + (k + 1) + ' = ' + u + ' · ส้ม ' + k + ' ส่วน = ' + u * k + ' ลูก'];
}
function genRatio() {
  const t = R(1, 4);
  if (t === 1) {
    let a = R(2, 7), b = R(2, 8); while (a === b) b = R(2, 8); const u = R(5, 30), tot = (a + b) * u;
    return ['ห้องเรียนมีนักเรียนชายต่อหญิงเป็น ' + a + ' : ' + b + ' มีนักเรียนทั้งหมด ' + tot + ' คน มีนักเรียนหญิงกี่คน', numChoices(b * u, [a * u, Math.abs(a - b) * u, tot / b]), 'รวม ' + a + ' + ' + b + ' = ' + (a + b) + ' ส่วน = ' + tot + ' คน → 1 ส่วน = ' + u + ' · หญิง ' + b + ' ส่วน = ' + b * u + ' คน'];
  }
  if (t === 2) {
    const flour = R(2, 5), egg = R(2, 4), m = R(2, 5);
    return ['สูตรขนมใช้แป้ง ' + flour + ' ถ้วย ต่อไข่ ' + egg + ' ฟอง ถ้าใช้แป้ง ' + flour * m + ' ถ้วย ต้องใช้ไข่กี่ฟอง', numChoices(egg * m, [egg + m, flour * m, egg * m + egg]), 'แป้งเพิ่มเป็น ' + m + ' เท่า (' + flour + ' → ' + flour * m + ') ไข่ก็ต้องเพิ่ม ' + m + ' เท่า: ' + egg + ' × ' + m + ' = ' + egg * m + ' ฟอง (บัญญัติไตรยางศ์)'];
  }
  if (t === 3) {
    const scale = [10000, 20000, 50000, 100000][R(0, 3)], cm = R(3, 15), km = cm * scale / 100000;
    return ['แผนที่มาตราส่วน 1 : ' + fmt(scale) + ' ระยะบนแผนที่ ' + cm + ' เซนติเมตร ระยะทางจริงกี่กิโลเมตร', [km, km * 10, km / 10, cm * scale / 100].map(v => +v.toFixed(3) + ' กม.'), cm + ' × ' + fmt(scale) + ' = ' + fmt(cm * scale) + ' ซม. · 1 กม. = 100,000 ซม. → ÷ 100,000 = ' + km + ' กม. (ระวังแปลงหน่วยผิด!)'];
  }
  const a = R(2, 5), b = a + R(1, 4), d = R(3, 12);
  return ['ปากกาต่อดินสอในกล่องเป็น ' + a + ' : ' + b + ' ถ้ามีปากกา ' + a * d + ' ด้าม จะมีดินสอกี่แท่ง', numChoices(b * d, [a * d + (b - a), (a + b) * d, b * d - d]), 'ปากกา ' + a + ' ส่วน = ' + a * d + ' ด้าม → 1 ส่วน = ' + d + ' · ดินสอ ' + b + ' ส่วน = ' + b + ' × ' + d + ' = ' + b * d + ' แท่ง (ห้ามบวกผลต่าง ' + (b - a) + ' เฉยๆ)'];
}
function genPercent() {
  const t = R(1, 6);
  if (t === 1) {
    const tag = R(3, 19) * 100, p = [10, 15, 20, 25, 30][R(0, 4)], off = tag * p / 100, pay = tag - off;
    return ['เสื้อติดป้ายราคา ' + fmt(tag) + ' บาท ร้านลดราคา ' + p + '% ลูกค้าต้องจ่ายเงินกี่บาท', numChoices(pay, [off, tag + off, tag - p]), 'ส่วนลด = ' + p + '% ของ ' + fmt(tag) + ' = ' + fmt(off) + ' บาท · จ่าย = ' + fmt(tag) + ' − ' + fmt(off) + ' = ' + fmt(pay) + ' บาท (โจทย์ถาม "จ่าย" ไม่ใช่ "ส่วนลด")'];
  }
  if (t === 2) {
    const cost = R(4, 30) * 20, p = [5, 10, 15, 20, 25][R(0, 4)], prof = cost * p / 100;
    if (!Number.isInteger(prof)) return genPercent();
    return ['แม่ค้าซื้อพัดลมมา ' + fmt(cost) + ' บาท ขายได้กำไร ' + p + '% แม่ค้าขายพัดลมราคากี่บาท', numChoices(cost + prof, [prof, cost - prof, cost + p]), 'กำไร ' + p + '% คิดจากทุนเสมอ: ' + p + '% ของ ' + fmt(cost) + ' = ' + fmt(prof) + ' · ขาย = ทุน + กำไร = ' + fmt(cost + prof) + ' บาท'];
  }
  if (t === 3) {
    const pc = [10, 20, 25, 40][R(0, 3)], cost = R(3, 30) * 100, loss = cost * pc / 100, sell = cost - loss;
    return ['ซื้อจักรยานมา ' + fmt(cost) + ' บาท ขายไป ' + fmt(sell) + ' บาท ขาดทุนกี่เปอร์เซ็นต์', [pc + '%', (100 - pc) + '%', +(loss * 100 / sell).toFixed(1) + '%', 'กำไร ' + pc + '%'], 'ขาดทุน = ' + fmt(cost) + ' − ' + fmt(sell) + ' = ' + fmt(loss) + ' บาท · คิดเทียบทุน: ' + fmt(loss) + ' ÷ ' + fmt(cost) + ' × 100 = ' + pc + '% (ห้ามหารด้วยราคาขาย)'];
  }
  if (t === 4) {
    const P = R(2, 20) * 1000, r = [2, 3, 4, 5][R(0, 3)], y = R(1, 3), I = P * r * y / 100;
    return ['ฝากเงินธนาคาร ' + fmt(P) + ' บาท ได้ดอกเบี้ย ' + r + '% ต่อปี (ดอกเบี้ยคงที่ทุกปี) ฝากไว้ ' + y + ' ปี จะได้ดอกเบี้ยรวมกี่บาท', numChoices(I, [P * r / 100, P + I, I + P * r / 100]).map(String), 'ดอกเบี้ยปีละ = ' + r + '% ของ ' + fmt(P) + ' = ' + fmt(P * r / 100) + ' · ' + y + ' ปี = ' + fmt(P * r / 100) + ' × ' + y + ' = ' + fmt(I) + ' บาท (ถาม "ดอกเบี้ย" ไม่ใช่เงินรวม)'];
  }
  if (t === 5) {
    const price = R(10, 60) * 100000, p = [1, 2, 3][R(0, 2)], c = price * p / 100;
    return ['นายหน้าขายที่ดินได้ราคา ' + fmt(price) + ' บาท ได้ค่านายหน้า ' + p + '% ของราคาขาย นายหน้าได้เงินกี่บาท', numChoices(c, [c * 10, c / 10, price - c]), 'ค่านายหน้า (commission) = ' + p + '% ของราคาขาย = ' + fmt(price) + ' × ' + p + ' ÷ 100 = ' + fmt(c) + ' บาท'];
  }
  const tot = R(4, 12) * 10, p = [10, 20, 25, 30, 40, 60, 75][R(0, 6)], n = tot * p / 100;
  if (!Number.isInteger(n)) return genPercent();
  return ['ห้องเรียนมีนักเรียน ' + tot + ' คน ' + p + '% ของนักเรียนใส่แว่น มีนักเรียนที่ไม่ใส่แว่นกี่คน', numChoices(tot - n, [n, tot - p, p]), 'ใส่แว่น = ' + p + '% ของ ' + tot + ' = ' + n + ' คน · ไม่ใส่ = ' + tot + ' − ' + n + ' = ' + (tot - n) + ' คน (อ่านกลับ: ถาม "ไม่ใส่")'];
}
function genPattern() {
  const t = R(1, 4);
  if (t === 1) {
    const a = R(2, 20), d = R(3, 9), s = [0, 1, 2, 3].map(k => a + k * d), n = R(10, 20), ans = a + (n - 1) * d;
    return ['แบบรูป ' + s.join(', ') + ', … พจน์ที่ ' + n + ' คือจำนวนใด', numChoices(ans, [a + n * d, ans - d, n * d]), 'เพิ่มทีละ ' + d + ' · พจน์ที่ n = ' + a + ' + (n − 1) × ' + d + ' → พจน์ที่ ' + n + ' = ' + a + ' + ' + (n - 1) + ' × ' + d + ' = ' + ans];
  }
  if (t === 2) {
    const a = R(1, 4), r = R(2, 3), s = [0, 1, 2, 3].map(k => a * r ** k), ans = a * r ** 4;
    return ['แบบรูป ' + s.join(', ') + ', ___ จำนวนถัดไปคืออะไร', numChoices(ans, [s[3] + (s[3] - s[2]), s[3] + r, s[3] * 2 + 1]), 'แต่ละพจน์คูณด้วย ' + r + ' · ' + s[3] + ' × ' + r + ' = ' + ans];
  }
  if (t === 3) {
    const n = R(5, 15), ans = 3 * n + 1;
    return ['ใช้ไม้ขีดต่อสี่เหลี่ยมเรียงเป็นแถว: 1 รูปใช้ 4 ก้าน, 2 รูปใช้ 7 ก้าน, 3 รูปใช้ 10 ก้าน ถ้าต่อ ' + n + ' รูป ใช้ไม้ขีดกี่ก้าน', numChoices(ans, [4 * n, 3 * n, 3 * n + 4]), 'เพิ่มรูปละ 3 ก้าน · n รูป = 3n + 1 → 3 × ' + n + ' + 1 = ' + ans + ' ก้าน (ไม่ใช่ 4 × ' + n + ' เพราะด้านติดกันใช้ร่วม)'];
  }
  const a = R(1, 5), s = [1, 2, 3, 4].map(k => k * k + a), ans = 25 + a;
  return ['แบบรูป ' + s.join(', ') + ', ___ จำนวนถัดไปคืออะไร', numChoices(ans, [s[3] + (s[3] - s[2]), s[3] + 7, s[3] + 8]), 'ผลต่างเพิ่มขึ้น 3, 5, 7 → ต่อไปเพิ่ม 9 · ' + s[3] + ' + 9 = ' + ans + ' (หรือ n² + ' + a + ')'];
}

function makeRound(topic) {
  if (topic.gen) return Array.from({ length: ROUND }, () => safe(topic.gen));

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = 'p6final-';
const best = k => { try { return +(localStorage.getItem(KEY + k) || 0); } catch (e) { return 0; } };
const setBest = (k, v) => { try { localStorage.setItem(KEY + k, String(v)); } catch (e) { } };
let SUBJ = null, TOP = null, Q = [], i = 0, ok = 0, streak = 0, miss = [];
function show(id) { ['home', 'topics', 'play', 'done'].forEach(x => $(x).classList.toggle('hidden', x !== id)); window.scrollTo(0, 0); }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function paintHome() {
  $('subjects').innerHTML = SUBJECTS.map((s, k) => '<button class="subj" style="border-color:' + s.color + '" data-k="' + k + '"><b>' + s.name + '</b><div class="d">' + s.sub + '</div></button>').join('');
  document.querySelectorAll('.subj').forEach(b => b.onclick = () => openSubj(SUBJECTS[+b.dataset.k]));
}
function openSubj(s) {
  SUBJ = s; $('sTitle').textContent = s.name; $('sSub').textContent = 'เลือกหัวข้อ · รอบละ ' + ROUND + ' ข้อ';
  $('topicList').innerHTML = s.topics.map((t, k) => { const b = best(t.id); const n = t.pool ? Math.min(ROUND, t.pool.length) : ROUND; return '<button class="t" data-k="' + k + '"><span class="best">' + (b ? '⭐ ' + b + '/' + n : '') + '</span><b>' + t.name + '</b><div class="d">' + t.sub + '</div></button>'; }).join('');
  document.querySelectorAll('.t').forEach(b => b.onclick = () => start(s.topics[+b.dataset.k]));
  show('topics');
}
function start(t) { TOP = t; Q = makeRound(t); i = 0; ok = 0; streak = 0; miss = []; show('play'); render(); }
function render() {
  const [q, c, w] = Q[i];
  $('hNo').textContent = i + 1; $('hOk').textContent = ok; $('hStreak').textContent = streak;
  $('tName').textContent = SUBJ.name + ' · ' + TOP.name;
  $('hOf').textContent = 'ข้อ / ' + Q.length;
  $('q').textContent = q; $('q').style.fontWeight = q.startsWith('📖') ? '400' : ''; $('fb').innerHTML = ''; $('next').classList.add('hidden');
  window.scrollTo(0, 0);
  const box = $('choices'); box.innerHTML = '';
  shuffle(c).forEach(t => { const b = document.createElement('button'); b.className = 'ch'; b.textContent = t; b.onclick = () => pick(t, b); box.appendChild(b); });
}
function pick(t, btn) {
  const [q, c, w] = Q[i], right = t === c[0];
  [...$('choices').children].forEach(b => { b.disabled = true; if (b.textContent === c[0]) b.classList.add('ok'); });
  if (right) { ok++; streak++; } else { btn.classList.add('bad'); streak = 0; miss.push(q.split('\n').pop().replace(/^❓ /, '') + ' → ' + c[0] + ' (' + w + ')'); }
  $('fb').innerHTML = '<div class="fb ' + (right ? 'ok' : 'bad') + '">' + (right ? '✅ ถูกต้อง! ' : '❌ คำตอบคือ <b>' + esc(c[0]) + '</b> — ') + esc(w) + '</div>';
  $('hOk').textContent = ok; $('hStreak').textContent = streak;
  $('next').textContent = i === Q.length - 1 ? 'ดูคะแนน 🎉' : 'ข้อต่อไป →'; $('next').classList.remove('hidden');
  try { $('next').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { }
  $('next').onclick = () => { i++; i < Q.length ? render() : finish(); };
}
function finish() {
  const n = Q.length, b = best(TOP.id); if (ok > b) setBest(TOP.id, ok);
  $('dTitle').textContent = TOP.name; $('dScore').textContent = ok + ' / ' + n;
  const p = ok / n; $('dStars').textContent = p >= 0.9 ? '⭐⭐⭐' : p >= 0.7 ? '⭐⭐' : p >= 0.5 ? '⭐' : '💪';
  $('dMsg').textContent = (ok > b ? '🎉 สถิติใหม่! ' : '') + (p >= 0.8 ? 'เก่งมาก พร้อมสอบแล้ว!' : p >= 0.5 ? 'ดีแล้ว เล่นอีกรอบให้ได้ 8 ขึ้นไปนะ' : 'ไม่เป็นไร อ่านคำอธิบายแล้วลองใหม่');
  $('dMiss').innerHTML = miss.length ? '<p style="color:var(--muted);text-align:center">ข้อที่ผิด — อ่านอีกครั้ง</p>' + miss.map(m => '<div class="miss">' + esc(m) + '</div>').join('') : '';
  show('done');
}
$('backHome').onclick = () => { paintHome(); show('home'); };
$('quit').onclick = function () { if (i > 0 && this.dataset.arm !== '1') { this.dataset.arm = '1'; this.textContent = 'แตะอีกครั้งเพื่อออก'; setTimeout(() => { this.dataset.arm = ''; this.textContent = '← กลับ'; }, 2500); return; } this.dataset.arm = ''; this.textContent = '← กลับ'; openSubj(SUBJ); };
$('toTopics').onclick = () => openSubj(SUBJ);
$('again').onclick = () => start(TOP);
paintHome();
</script>
