<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ป.4 ทบทวนสอบปลายภาค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--ink:#1a1c1e;--muted:#5b6167;--line:#dfe3e8;--bg:#fbfbfa;--card:#fff;--soft:#f4f6f8;
--accent:#1f6feb;--ok:#136c39;--ok-bg:#e8f6ee;--bad:#b3261e;--bad-bg:#fdecea;
--en:#1f6feb;--ma:#b25000;--th:#6b46e0;--sc:#136c39}
@media (prefers-color-scheme:dark){:root{
--ink:#e6e8ea;--muted:#9aa2ab;--line:#333a42;--bg:#16181b;--card:#1e2126;--soft:#262a30;
--accent:#69a4ff;--ok:#6fd39a;--ok-bg:#13301f;--bad:#ff8a80;--bad-bg:#3a1a17;
--en:#69a4ff;--ma:#f0a163;--th:#a68cff;--sc:#6fd39a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",-apple-system,sans-serif;font-size:18px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px calc(60px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.hidden{display:none !important}
button{font-family:inherit;font-size:1rem;cursor:pointer}
.subj{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.subj b{font-size:1.15rem}
.subj .d{color:var(--muted);font-size:.86rem}
.t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.t .best{float:right;font-size:.8rem;color:var(--ok);font-weight:700}
.t .d{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.hud{display:flex;gap:10px;margin-bottom:12px}
.pill{flex:1;background:var(--soft);border-radius:11px;padding:6px;text-align:center;line-height:1.3}
.pill .n{font-size:1.25rem;font-weight:700;font-family:"IBM Plex Mono",monospace}
.pill .l{font-size:.72rem;color:var(--muted)}
.q{font-size:1.15rem;font-weight:600;margin:4px 0 14px;white-space:pre-line}
.ch{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)}
.ch.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:10px 14px;margin:4px 0 12px;font-size:.96rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.go{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.88rem}
.big{font-size:2.4rem;font-weight:700;text-align:center}
.stars{font-size:2rem;text-align:center}
.miss{font-size:.9rem;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
  <h1>⭐ ป.4 ทบทวนสอบปลายภาค</h1>
  <p class="sub">ภาคเรียนที่ 1/2569 · สอบศุกร์ 16 ต.ค. · เลือกวิชา แล้วเลือกหัวข้อ · รอบละ 10 ข้อ ผิดข้อไหนมีคำอธิบาย</p>
  <div id="subjects"></div>
</section>
<section id="topics" class="hidden">
  <h1 id="sTitle"></h1><p class="sub" id="sSub"></p>
  <div id="topicList"></div>
  <p style="text-align:center"><button class="ghost" id="backHome">← เลือกวิชาอื่น</button></p>
</section>
<section id="play" class="hidden">
  <div class="hud">
    <div class="pill"><div class="n" id="hNo">1</div><div class="l">ข้อ / 10</div></div>
    <div class="pill"><div class="n" id="hOk">0</div><div class="l">ถูก</div></div>
    <div class="pill"><div class="n" id="hStreak">0</div><div class="l">ถูกติดกัน 🔥</div></div>
  </div>
  <div class="card">
    <div class="sub" id="tName" style="margin:0 0 4px"></div>
    <div class="q" id="q"></div>
    <div id="choices"></div>
    <div id="fb"></div>
    <button class="go hidden" id="next">ข้อต่อไป →</button>
  </div>
  <p style="text-align:center;margin-top:12px"><button class="ghost" id="quit">← กลับ</button></p>
</section>
<section id="done" class="hidden">
  <div class="card">
    <h1 id="dTitle"></h1>
    <div class="stars" id="dStars"></div>
    <div class="big" id="dScore"></div>
    <p style="text-align:center;color:var(--muted)" id="dMsg"></p>
    <div id="dMiss"></div>
    <button class="go" id="again">เล่นอีกรอบ (ข้อใหม่)</button>
    <p style="text-align:center;margin-top:10px"><button class="ghost" id="toTopics">← เลือกหัวข้อ</button></p>
  </div>
</section>
<footer>เกมทบทวน ป.4 · ข้อในเกมแต่งใหม่ตามหัวข้อในตารางสอบ · สถิติเก็บในเครื่องนี้</footer>
</main>

function numChoices(ans, cands) { const s = [ans]; for (const c of cands) if (c > 0 && Number.isInteger(c) && !s.includes(c)) s.push(c); let k = 1; while (s.length < 4) { const v = ans + k * (k % 2 ? 10 : -1); if (v > 0 && !s.includes(v)) s.push(v); k++; } return s.slice(0, 4).map(fmt); }

/* คณิตแบบสุ่มตัวเลข */
function genAdd() {
  const a = R(10000, 89999), b = R(1000, 49999);
  if (Math.random() < 0.5) { const ans = a + b; return ['หาผลบวก\n' + fmt(a) + ' + ' + fmt(b) + ' = ?', numChoices(ans, [ans - 1000, ans + 10, ans - 100, ans + 1000]), 'บวกทีละหลักจากหลักหน่วย อย่าลืมทด · ' + fmt(a) + ' + ' + fmt(b) + ' = ' + fmt(ans)]; }
  const big = a + b, ans = big - b; return ['หาผลลบ\n' + fmt(big) + ' − ' + fmt(b) + ' = ?', numChoices(ans, [ans + 1000, ans - 10, ans + 100, ans - 1000]), 'ลบทีละหลัก อย่าลืมกระจาย (ยืม) · ตรวจ: ' + fmt(ans) + ' + ' + fmt(b) + ' = ' + fmt(big)];
}
function genMul() {
  const t = Math.random();
  if (t < 0.4) { const a = R(102, 899), b = R(3, 9), ans = a * b; return ['หาผลคูณ\n' + fmt(a) + ' × ' + b + ' = ?', numChoices(ans, [ans + b, ans - 10, a * (b + 1), ans + 100]), fmt(a) + ' × ' + b + ' = ' + fmt(ans) + ' (คูณหลักหน่วย สิบ ร้อย แล้วทด)']; }
  if (t < 0.7) { const a = R(12, 98), b = R(11, 49), ans = a * b; return ['หาผลคูณ\n' + a + ' × ' + b + ' = ?', numChoices(ans, [a * (b % 10) + a * Math.floor(b / 10), ans + 10, ans - a, ans + a]), a + ' × ' + b + ' = ' + a + ' × ' + (b % 10) + ' + ' + a + ' × ' + (b - b % 10) + ' = ' + fmt(ans) + ' · ระวัง! คูณหลักสิบต้องเลื่อนเลขไป 1 หลัก']; }
  const d = R(3, 9), q = R(120, 999), r = Math.random() < 0.5 ? 0 : R(1, d - 1), n = d * q + r;
  const label = r ? q + ' เศษ ' + r : String(q);
  const opts = [label, (q + 1) + (r ? ' เศษ ' + r : ''), (q - 10) + (r ? ' เศษ ' + r : ''), r ? q + ' เศษ ' + (r === d - 1 ? 0 : r + 1) : q + ' เศษ 1'];
  return ['หาผลหาร\n' + fmt(n) + ' ÷ ' + d + ' = ?', [...new Set(opts)].concat(['ไม่มีคำตอบ']).slice(0, 4), 'ตรวจด้วยการคูณกลับ: ' + q + ' × ' + d + (r ? ' + ' + r : '') + ' = ' + fmt(n)];
}
function genWord() {
  const t = R(1, 6);
  if (t === 1) { const p = R(12, 48), n = R(15, 35), ans = p * n; return ['ดินสอราคาแท่งละ ' + p + ' บาท ครูซื้อ ' + n + ' แท่ง ครูต้องจ่ายเงินกี่บาท', numChoices(ans, [p + n, ans - p, ans + 10, p * (n - 1)]), 'ของหลายชิ้นราคาเท่ากัน → คูณ: ' + p + ' × ' + n + ' = ' + fmt(ans) + ' บาท']; }
  if (t === 2) { const per = R(6, 9), g = R(25, 60), tot = per * g; return ['มีส้ม ' + fmt(tot) + ' ผล แบ่งใส่ถุง ถุงละ ' + per + ' ผล จะได้กี่ถุง', numChoices(g, [tot - per, g + 1, g * 10, g - 1]), 'แบ่งเท่าๆ กัน → หาร: ' + fmt(tot) + ' ÷ ' + per + ' = ' + g + ' ถุง']; }
  if (t === 3) { const have = R(2000, 9000), spend = R(500, 1900), ans = have - spend; return ['แม่มีเงิน ' + fmt(have) + ' บาท ซื้อรองเท้า ' + fmt(spend) + ' บาท แม่เหลือเงินกี่บาท', numChoices(ans, [have + spend, ans + 100, ans - 10, spend]), 'คำว่า "เหลือ" → ลบ: ' + fmt(have) + ' − ' + fmt(spend) + ' = ' + fmt(ans) + ' บาท']; }
  if (t === 4) { const a = R(1200, 4500), b = R(800, 3000), c = R(300, 900), ans = a + b - c; return ['โรงเรียนมีหนังสือ ' + fmt(a) + ' เล่ม ได้รับบริจาคเพิ่ม ' + fmt(b) + ' เล่ม แล้วให้ห้องสมุดชุมชนไป ' + fmt(c) + ' เล่ม โรงเรียนเหลือหนังสือกี่เล่ม', numChoices(ans, [a + b + c, a + b, a - b + c, ans + 100]), 'ทำทีละขั้น: บวกที่ได้เพิ่ม แล้วลบที่ให้ไป · ' + fmt(a) + ' + ' + fmt(b) + ' − ' + fmt(c) + ' = ' + fmt(ans)]; }
  if (t === 5) { const rows = R(12, 25), per = R(14, 30), absent = R(5, 20), ans = rows * per - absent; return ['ห้องประชุมมีเก้าอี้ ' + rows + ' แถว แถวละ ' + per + ' ตัว มีนักเรียนนั่งเต็มทุกตัว แล้วลุกออกไป ' + absent + ' คน เหลือนักเรียนนั่งอยู่กี่คน', numChoices(ans, [rows * per, rows + per - absent, ans + absent * 2, ans - 1]), 'หาจำนวนเก้าอี้ก่อน ' + rows + ' × ' + per + ' = ' + fmt(rows * per) + ' แล้วลบ ' + absent + ' = ' + fmt(ans)]; }
  const price = R(35, 90), n = R(4, 9), pay = Math.ceil(price * n / 100) * 100 + (Math.random() < 0.5 ? 0 : 100), ans = pay - price * n;
  return ['ซื้อขนมราคาชิ้นละ ' + price + ' บาท จำนวน ' + n + ' ชิ้น จ่ายเงิน ' + fmt(pay) + ' บาท จะได้เงินทอนกี่บาท', numChoices(ans, [pay - price, price * n, ans + 10, ans - 5]), 'ราคารวม ' + price + ' × ' + n + ' = ' + fmt(price * n) + ' · ทอน ' + fmt(pay) + ' − ' + fmt(price * n) + ' = ' + fmt(ans) + ' บาท'];
}

const SUBJECTS = [
 { id: 'en', name: '🇬🇧 ภาษาอังกฤษ', sub: 'Vocabulary · Phonics · Grammar · to/-ing', color: 'var(--en)', topics: [
   { id: 'en1', name: 'Vocabulary', sub: 'countries · wild animals · clothing · seasons · weather', pool: EN_VOCAB },
   { id: 'en2', name: 'Phonics', sub: 'long o/u/i · magic e · th / sh / ch', pool: EN_PHONICS },
   { id: 'en3', name: 'Grammar', sub: 'present simple/continuous · prepositions · has/have · this is/these are', pool: EN_GRAMMAR },
   { id: 'en4', name: 'Watching Seals: to + V / V-ing', sub: 'want to · enjoy -ing · like both', pool: EN_INF } ] },
 { id: 'ma', name: '🔢 คณิตศาสตร์', sub: 'บวกลบ · คูณหาร · โจทย์ปัญหาระคน · มุม', color: 'var(--ma)', topics: [
   { id: 'ma1', name: 'การบวกและการลบ', sub: 'จำนวนหลักหมื่น · ทด · กระจาย', gen: genAdd },
   { id: 'ma2', name: 'การคูณและการหาร', sub: 'คูณ 1–2 หลัก · หารมีเศษ', gen: genMul },
   { id: 'ma3', name: 'โจทย์ปัญหาระคน', sub: 'อ่านโจทย์ → บวก ลบ คูณ หาร กี่ขั้น', gen: genWord },
   { id: 'ma4', name: 'รูปเรขาคณิตและมุม', sub: 'ชนิดของมุม · เส้น · รังสี · ขนาน/ตั้งฉาก', pool: MA_GEO } ] },
 { id: 'th', name: '📖 ภาษาไทย', sub: 'ข้อเท็จจริง/ข้อคิดเห็น · อ่านจับใจความ', color: 'var(--th)', topics: [
   { id: 'th1', name: 'ข้อเท็จจริง หรือ ข้อคิดเห็น', sub: 'ตรวจสอบได้ = ข้อเท็จจริง · ความรู้สึก = ข้อคิดเห็น', pool: TH_FACT },
   { id: 'th2', name: 'อ่านเรื่องแล้วตอบคำถาม', sub: 'หาข้อมูลในเรื่อง · ใจความสำคัญ · เหตุผล', pool: TH_READ } ] },
 { id: 'sc', name: '🔬 วิทยาศาสตร์', sub: 'สมบัติของวัสดุ · สถานะของสสาร', color: 'var(--sc)', topics: [
   { id: 'sc1', name: 'Ep.4 สมบัติของวัสดุ', sub: 'ความแข็ง · ยืดหยุ่น · นำความร้อน · นำไฟฟ้า', pool: SC_PROP },
   { id: 'sc2', name: 'Ep.5 สถานะของสสาร', sub: 'ของแข็ง · ของเหลว · แก๊ส', pool: SC_STATE } ] },
];
const ROUND = 10;
function makeRound(topic) {
  if (topic.gen) return Array.from({ length: ROUND }, () => topic.gen());
  const p = shuffle(topic.pool); return p.slice(0, Math.min(ROUND, p.length));
}
if (typeof module !== 'undefined') module.exports = { SUBJECTS, makeRound, genAdd, genMul, genWord };

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = 'p4final-';
const best = k => { try { return +(localStorage.getItem(KEY + k) || 0); } catch (e) { return 0; } };
const setBest = (k, v) => { try { localStorage.setItem(KEY + k, String(v)); } catch (e) { } };
let SUBJ = null, TOP = null, Q = [], i = 0, ok = 0, streak = 0, miss = [];
function show(id) { ['home', 'topics', 'play', 'done'].forEach(x => $(x).classList.toggle('hidden', x !== id)); window.scrollTo(0, 0); }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function paintHome() {
  $('subjects').innerHTML = SUBJECTS.map((s, k) => '<button class="subj" style="border-color:' + s.color + '" data-k="' + k + '"><b>' + s.name + '</b><div class="d">' + s.sub + '</div></button>').join('');
  document.querySelectorAll('.subj').forEach(b => b.onclick = () => openSubj(SUBJECTS[+b.dataset.k]));
}
function openSubj(s) {
  SUBJ = s; $('sTitle').textContent = s.name; $('sSub').textContent = 'เลือกหัวข้อ · รอบละ ' + ROUND + ' ข้อ';
  $('topicList').innerHTML = s.topics.map((t, k) => { const b = best(t.id); return '<button class="t" data-k="' + k + '"><span class="best">' + (b ? '⭐ ' + b + '/' + ROUND : '') + '</span><b>' + t.name + '</b><div class="d">' + t.sub + '</div></button>'; }).join('');
  document.querySelectorAll('.t').forEach(b => b.onclick = () => start(s.topics[+b.dataset.k]));
  show('topics');
}
function start(t) { TOP = t; Q = makeRound(t); i = 0; ok = 0; streak = 0; miss = []; show('play'); render(); }
function render() {
  const [q, c, w] = Q[i];
  $('hNo').textContent = i + 1; $('hOk').textContent = ok; $('hStreak').textContent = streak;
  $('tName').textContent = SUBJ.name + ' · ' + TOP.name;
  $('q').textContent = q; $('fb').innerHTML = ''; $('next').classList.add('hidden');
  const box = $('choices'); box.innerHTML = '';
  shuffle(c).forEach(t => { const b = document.createElement('button'); b.className = 'ch'; b.textContent = t; b.onclick = () => pick(t, b); box.appendChild(b); });
}
function pick(t, btn) {
  const [q, c, w] = Q[i], right = t === c[0];
  [...$('choices').children].forEach(b => { b.disabled = true; if (b.textContent === c[0]) b.classList.add('ok'); });
  if (right) { ok++; streak++; } else { btn.classList.add('bad'); streak = 0; miss.push(q.split('\n').pop() + ' → ' + c[0]); }
  $('fb').innerHTML = '<div class="fb ' + (right ? 'ok' : 'bad') + '">' + (right ? '✅ ถูกต้อง! ' : '❌ คำตอบคือ <b>' + esc(c[0]) + '</b> — ') + esc(w) + '</div>';
  $('hOk').textContent = ok; $('hStreak').textContent = streak;
  $('next').textContent = i === Q.length - 1 ? 'ดูคะแนน 🎉' : 'ข้อต่อไป →'; $('next').classList.remove('hidden');
  $('next').onclick = () => { i++; i < Q.length ? render() : finish(); };
}
function finish() {
  const n = Q.length, b = best(TOP.id); if (ok > b) setBest(TOP.id, ok);
  $('dTitle').textContent = TOP.name; $('dScore').textContent = ok + ' / ' + n;
  const p = ok / n; $('dStars').textContent = p >= 0.9 ? '⭐⭐⭐' : p >= 0.7 ? '⭐⭐' : p >= 0.5 ? '⭐' : '💪';
  $('dMsg').textContent = (ok > b ? '🎉 สถิติใหม่! ' : '') + (p >= 0.8 ? 'เก่งมาก พร้อมสอบแล้ว!' : p >= 0.5 ? 'ดีแล้ว เล่นอีกรอบให้ได้ 8 ขึ้นไปนะ' : 'ไม่เป็นไร อ่านคำอธิบายแล้วลองใหม่');
  $('dMiss').innerHTML = miss.length ? '<p style="color:var(--muted);text-align:center">ข้อที่ผิด — อ่านอีกครั้ง</p>' + miss.map(m => '<div class="miss">' + esc(m) + '</div>').join('') : '';
  show('done');
}
$('backHome').onclick = () => { paintHome(); show('home'); };
$('quit').onclick = () => openSubj(SUBJ);
$('toTopics').onclick = () => openSubj(SUBJ);
$('again').onclick = () => start(TOP);
paintHome();
</script>
