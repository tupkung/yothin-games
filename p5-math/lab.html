<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องทดลองตัวเลข ป.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--ink:#1a1c1e;--muted:#5b6167;--line:#dfe3e8;--bg:#fbfbfa;--card:#fff;--soft:#eef1f4;
--accent:#1f6feb;--ok:#136c39;--ok-bg:#e8f6ee;--bad:#b3261e;--bad-bg:#fdecea;
--num:#1f6feb;--code:#0f7b6c;--on-accent:#fff;--tip:#fff7e0;--tip-line:#e6c565;
--fill:#3d7ff0;--fill2:#f08a24;--lamp:#ffc21a;--lamp-glow:#ffe58a;--sig:#e8a100;--wall:#4a5059}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--ink:#e6e8ea;--muted:#9aa2ab;--line:#3a414a;--bg:#16181b;--card:#1e2126;--soft:#2a2f36;
--accent:#69a4ff;--ok:#6fd39a;--ok-bg:#13301f;--bad:#ff8a80;--bad-bg:#3a1a17;
--num:#69a4ff;--code:#4fd1bd;--on-accent:#0b1a33;--tip:#2e2814;--tip-line:#7a6526;
--fill:#5b95ff;--fill2:#f0a163;--lamp:#ffd24d;--lamp-glow:#6b5a1a;--sig:#ffc94d;--wall:#8a929c}}
:root[data-theme="dark"]{
--ink:#e6e8ea;--muted:#9aa2ab;--line:#3a414a;--bg:#16181b;--card:#1e2126;--soft:#2a2f36;
--accent:#69a4ff;--ok:#6fd39a;--ok-bg:#13301f;--bad:#ff8a80;--bad-bg:#3a1a17;
--num:#69a4ff;--code:#4fd1bd;--on-accent:#0b1a33;--tip:#2e2814;--tip-line:#7a6526;
--fill:#5b95ff;--fill2:#f0a163;--lamp:#ffd24d;--lamp-glow:#6b5a1a;--sig:#ffc94d;--wall:#8a929c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",-apple-system,sans-serif;font-size:18px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px calc(60px + env(safe-area-inset-bottom))}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:20px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.hidden{display:none !important}
button{font-family:inherit;font-size:1rem;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.tipbox{background:var(--tip);border:1px solid var(--tip-line);border-radius:12px;padding:10px 14px;font-size:.9rem;margin:0 0 12px}
.t{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 15px;margin-bottom:9px}
.t .best{float:right;font-size:.8rem;color:var(--ok);font-weight:700}
.t .d{color:var(--muted);font-size:.84rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top .p{font-size:.85rem;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.mtext{font-size:1.08rem;font-weight:600;white-space:pre-line;margin:2px 0 10px}
.go{display:block;width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px;font-weight:700;margin-top:10px}
.go:disabled{opacity:.5}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.88rem}
.hintbtn{background:transparent;border:1px dashed var(--tip-line);border-radius:10px;padding:5px 12px;font-size:.88rem;margin:0 0 8px}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:.95rem;white-space:pre-line}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.hint{background:var(--tip);border:1px solid var(--tip-line)}
.ask{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ask .q{font-weight:700;white-space:pre-line;margin-bottom:8px}
.ch{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:48px}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)}
.ch.bad{border-color:var(--bad);background:var(--bad-bg)}
.big{font-size:2.3rem;font-weight:700;text-align:center}
.stars{font-size:2rem;text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.mono{font-family:"IBM Plex Mono",monospace}
.readout{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.95rem;margin-top:8px;white-space:pre-line}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:22px}
svg text{fill:currentColor;font-family:"Sarabun",sans-serif}
/* แท่งเศษส่วน */
.barrow{margin-bottom:10px}
.bh{font-size:.9rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.bh .stp{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.bh .stp button{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.barrow svg{width:100%;height:auto;display:block}
.seg{fill:var(--soft);stroke:var(--muted);stroke-width:1;cursor:pointer}
.seg.on{fill:var(--fill)}
.seg.lk.on{fill:var(--fill2)}
.guide{stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3;pointer-events:none}
/* ตาราง */
.g100{display:grid;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;max-width:400px;margin:0 auto}
.cell{aspect-ratio:1;background:var(--soft);border:1px solid var(--line);border-radius:3px}
.cell.on{background:var(--fill);border-color:var(--fill)}
.rb{border:0;background:transparent;color:var(--muted);font-size:.7rem;padding:0}
.pcode{font-family:"IBM Plex Mono",monospace;font-size:.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);letter-spacing:-.5px}
.pcode.match{color:var(--ok);font-weight:600}
.pcode.hl{color:var(--bad);font-weight:700}
/* หลอดไฟ */
.bits{display:grid;gap:6px 4px;align-items:center;max-width:420px;margin:0 auto}
.bits .pv{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--muted);font-weight:600}
.bits .bl{font-size:.8rem;color:var(--muted);line-height:1.2}
.bulb{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--soft);margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1rem;color:var(--muted);padding:0}
.bulb.on{background:var(--lamp);border-color:var(--sig);color:#3b2a00;box-shadow:0 0 12px 3px var(--lamp-glow)}
.bulb.lk{cursor:default}
.bulb.help{width:30px;height:30px;font-size:.75rem;border-style:dashed}
.rowro{grid-column:1/-1;font-size:.85rem;color:var(--muted);margin:-2px 0 4px;text-align:right}
.abc{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;margin:0 0 8px;justify-content:center}
/* วงจร */
.gate svg{width:100%;max-width:400px;display:block;margin:0 auto}
.wire{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.wire.on{stroke:var(--sig)}
.box{fill:var(--card);stroke:var(--muted);stroke-width:1.5}
.swr{fill:var(--soft);stroke:var(--muted);stroke-width:1.5;cursor:pointer}
.swr.on{fill:var(--lamp);stroke:var(--sig)}
.lampc{fill:var(--soft);stroke:var(--muted);stroke-width:1.5}
.lampc.on{fill:var(--lamp);stroke:var(--sig)}
.tt{border-collapse:collapse;margin:8px auto 0;font-family:"IBM Plex Mono",monospace;font-size:.9rem}
.tt td,.tt th{border:1px solid var(--line);padding:2px 10px;text-align:center}
.tt th{font-family:"Sarabun",sans-serif;font-size:.8rem;color:var(--muted)}
/* เส้นจำนวน */
.zoom svg{width:100%;display:block}
.gap{fill:transparent;cursor:zoom-in}
.gap:hover,.gap:active{fill:var(--soft)}
.gaphint{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.tk{fill:transparent;cursor:pointer}
.zl{stroke:currentColor;stroke-width:2}
.zp{fill:var(--bad)}
.zg{fill:var(--tip);stroke:var(--tip-line)}
.zrow{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
/* หุ่นยนต์ */
.rob svg{width:100%;max-width:330px;display:block;margin:0 auto}
.rc{fill:var(--soft);stroke:var(--line)}
.rw{fill:var(--wall)}
.rbody{fill:var(--accent)}
.rnose{fill:var(--on-accent)}
.prog{display:flex;flex-wrap:wrap;gap:5px;min-height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;margin:8px 0 6px}
.chip{font-size:.85rem;border-radius:8px;padding:3px 8px;background:var(--soft);border:1px solid var(--line)}
.chip.lp{background:var(--tip);border-color:var(--tip-line)}
.chip.run{outline:2px solid var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.9rem}
.pal button.lp{background:var(--tip);border-color:var(--tip-line)}
.par svg{width:100%;max-width:400px;display:block;margin:0 auto}
.ps{fill:transparent;stroke:none;pointer-events:none}
.ps.sl{fill:var(--fill);opacity:.55}
.ps.mk{fill:var(--fill2);opacity:.85}
.psel{fill:var(--fill);opacity:.45;pointer-events:none}
.rng{width:100%;margin:8px 0 0;accent-color:var(--accent);height:28px}
.cubev svg{width:100%;display:block;margin:0 auto}
.cbt{fill:#a9c7ff;stroke:var(--card);stroke-width:1}
.cbl{fill:#3d7ff0;stroke:var(--card);stroke-width:1}
.cbr{fill:#2758b8;stroke:var(--card);stroke-width:1}
.cubec .stp{display:inline-flex;align-items:center;gap:4px;font-size:.9rem}
.cubec .stp button{width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.cards{display:grid;gap:5px;margin:0 auto;align-items:center}
.cd{aspect-ratio:1;border-radius:8px;border:2px solid var(--line);background:var(--card);font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--muted);padding:0}
.cd.on{background:var(--fill2);border-color:var(--fill2);color:#3b2a00}
.cd.pc{border-style:dashed;border-color:var(--muted)}
.cd.on.pc{border-color:var(--ink)}
.cd.pk{outline:3px solid var(--accent);outline-offset:1px}
.cd.mk{outline:3px solid var(--bad);outline-offset:1px}
.cnt{font-size:.72rem;color:var(--muted);text-align:center;font-family:"IBM Plex Mono",monospace;line-height:1.1}
.cnt.odd{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
  <h1>🔬 ห้องทดลองตัวเลข + 💻 โค้ด 0 กับ 1</h1>
  <p class="sub">ไม่ต้องท่องสูตร ลองแตะ ลาก เปิดไฟ สั่งหุ่นยนต์ แล้วดูว่าตัวเลขทำงานยังไง</p>
  <div class="tipbox">ห้องละ 6 ภารกิจ (หุ่นยนต์มี 8 ด่าน) · ทำเสร็จกด <b>✓ ตรวจ</b> · ผิดได้ไม่เป็นไร จะบอกว่าขาดหรือเกินตรงไหน · ติดตรงไหนกด 💡</div>
  <div id="labList"></div>
</section>
<section id="lab" class="hidden">
  <div class="top"><b id="lTitle"></b><span class="p" id="lProg"></span></div>
  <div class="card">
    <div class="mtext" id="lText"></div>
    <button class="hintbtn" id="lHintBtn">💡 ขอใบ้</button>
    <div id="lHint"></div>
    <div id="wbox"></div>
    <button class="go" id="lCheck">✓ ตรวจ</button>
    <div id="lFb"></div>
    <div id="lAsk"></div>
    <button class="go hidden" id="lNext">ภารกิจต่อไป ➜</button>
  </div>
  <p style="text-align:center;margin-top:12px"><button class="ghost" id="lQuit">← กลับ</button></p>
</section>
<section id="done" class="hidden">
  <div class="card">
    <h1 id="dTitle"></h1>
    <div class="stars" id="dStars"></div>
    <div class="big" id="dScore"></div>
    <p style="text-align:center;color:var(--muted);white-space:pre-line" id="dMsg"></p>
    <button class="go" id="dAgain">เล่นอีกรอบ (ภารกิจใหม่)</button>
    <p style="text-align:center;margin-top:10px"><button class="ghost" id="dHome">← เลือกห้องอื่น</button></p>
  </div>
</section>
<footer>ห้องทดลองตัวเลข ป.5 · ภารกิจสุ่มใหม่ทุกรอบ · สถิติเก็บในเครื่องนี้</footer>
</main>

<script id="labgen">
/* ส่วนคำนวณล้วน (ไม่แตะหน้าจอ) — ทดสอบด้วย Node ได้
   ภารกิจหนึ่งข้อ = { kind, text, hint?, init: สถานะเริ่ม, check(สถานะ, ครั้งที่ตรวจ) → {ok, msg}, solve() → สถานะที่ถูก,
                     why: [บรรทัดอธิบาย], ask?: {q, c:[ถูก, ลวง...], why:{ลวง: เหตุผล}}, noCheck?: ถามอย่างเดียว, level?: ด่านหุ่นยนต์ } */
var LABGEN = (function () {
"use strict";
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
function frs(n, d) { if (n === 0) return '0'; const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : n + '/' + d; }
const bin = (v, n) => v.toString(2).padStart(n, '0');
const toBits = (v, n) => bin(v, n).split('').map(Number);
const bitsVal = b => b.reduce((s, x) => s * 2 + (x ? 1 : 0), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const ok = () => ({ ok: true, msg: '' });
const no = msg => ({ ok: false, msg });
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const dec100 = v => String(v / 100);              // 35 → "0.35" · 40 → "0.4"
/* สร้างคำถามตัวเลือก: ds = [[ข้อความ, เหตุผล]] ตัดตัวซ้ำออก */
function A(q, ans, ds, pad) {
  const c = [String(ans)], why = {};
  for (const [t, r] of ds) { const s = String(t); if (c.includes(s) || c.length >= 4) continue; c.push(s); if (r) why[s] = r; }
  for (const [t, r] of (pad || [])) { const s = String(t); if (c.length >= 4) break; if (c.includes(s)) continue; c.push(s); if (r) why[s] = r; }
  return { q, c, why };
}
function coprime(d) { const c = []; for (let n = 1; n < d; n++) if (gcd(n, d) === 1) c.push(n); return pick(c); }

/* ================= 🍫 แท่งเศษส่วน ================= */
/* สถานะ: { bars: [{ d: จำนวนช่อง, k: ระบายกี่ช่อง, lock: ห้ามแก้, fix: ห้ามเปลี่ยนจำนวนช่อง, label }] } */
function barMsg(b, tn, td, name, t) {
  const k = b.k, D = b.d;
  if ((tn * D) % td !== 0) return name + 'แท่งนี้ตัดไว้ ' + D + ' ช่อง เส้นแบ่งไม่ตรงกับ ' + frs(tn, td) + ' พอดี\nลองเปลี่ยนจำนวนช่องเป็นเลขที่ ' + td + ' หารลงตัว';
  const need = tn * D / td;
  let m = name + 'ตอนนี้ระบาย ' + k + ' ช่อง = ' + (k ? frs(k, D) : '0') + (k < need ? ' — ยังสั้นไป ระบายเพิ่มอีก' : ' — ยาวเกินไป ลดลงหน่อย');
  if (t >= 2) m += '\n(1/' + td + ' ของแท่ง = ' + D + ' ÷ ' + td + ' = ' + (D / td) + ' ช่อง)';
  return m;
}
function fFill(two) {
  const d = pick(two ? [2, 3, 4, 5, 6] : [3, 4, 5, 6, 8]), n = coprime(d), mult = two ? (d <= 4 ? pick([2, 3]) : 2) : 1, D = d * mult;
  const bar = k => ({ bars: [{ d: D, k, fix: true, label: 'แท่งของเรา' }] });
  return {
    kind: 'frac', text: mult === 1 ? 'ระบายแท่งให้ได้ ' + n + '/' + d + ' ของแท่ง' : 'แท่งนี้ตัดไว้ ' + D + ' ช่อง\nระบายให้ได้ ' + n + '/' + d + ' ของแท่ง',
    hint: mult === 1 ? 'แท่งแบ่งเป็น ' + d + ' ช่องเท่ากันแล้ว · ' + n + '/' + d + ' คือระบาย ' + n + ' ช่องจาก ' + d + ' ช่อง' : '1/' + d + ' ของแท่ง = ' + D + ' ÷ ' + d + ' = ' + mult + ' ช่อง',
    init: bar(0),
    check: (s, t) => { const b = s.bars[0]; return b.k * d === n * b.d ? ok() : no(barMsg(b, n, d, '', t)); },
    solve: () => bar(n * mult),
    why: mult === 1 ? ['แท่งแบ่งเป็น ' + d + ' ช่องเท่า ๆ กัน', 'ระบาย ' + n + ' ช่อง = ' + n + '/' + d + ' ของแท่ง'] :
      ['แท่งมี ' + D + ' ช่อง · 1/' + d + ' ของแท่ง = ' + D + ' ÷ ' + d + ' = ' + mult + ' ช่อง', n + '/' + d + ' จึงระบาย ' + n + ' × ' + mult + ' = ' + (n * mult) + ' ช่อง',
        (n * mult) + '/' + D + ' ยาวเท่ากับ ' + n + '/' + d + ' พอดี เรียกว่า "เศษส่วนที่เท่ากัน" (equivalent fractions)']
  };
}
function fEquiv() {
  const d = pick([2, 3, 4, 6]), n = coprime(d), m = pick([2, 3, 4].filter(x => d * x <= 12)), D = d * m;
  const st = k => ({ bars: [{ d, k: n, lock: true, label: 'แท่งบน' }, { d: k === null ? 1 : D, k: k || 0, label: 'แท่งล่าง' }] });
  return {
    kind: 'frac', text: 'แท่งบนระบาย ' + n + '/' + d + ' ไว้แล้ว\nตัดแท่งล่างเป็น ' + D + ' ช่อง (กด + หรือ −)\nแล้วระบายให้ยาวเท่าแท่งบน',
    hint: 'กด + จนแท่งล่างมี ' + D + ' ช่อง แล้วระบายจนถึงเส้นประสีแดง',
    init: st(null),
    check: (s, t) => { const b = s.bars[1]; if (b.d !== D) return no('แท่งล่างตอนนี้มี ' + b.d + ' ช่อง — โจทย์ให้ตัดเป็น ' + D + ' ช่อง'); return b.k * d === n * D ? ok() : no(barMsg(b, n, d, '', t)); },

      const lr = (b - a) < 50 ? 40 : 33, lx = px + lr * Math.cos(rad(mid)), ly = py - lr * Math.sin(rad(mid));
      const val = pAngUI(n, phi);
      if (st.sel.includes(n)) s += '<circle class="psel" cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="13"/>';
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700">' + (n === st.mark ? '★' : n) + '</text>';
      if (showVal || n === st.mark) s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 19).toFixed(1) + '" text-anchor="middle" font-size="10.5" fill="var(--muted)">' + val + '°</text>';
      taps += '<circle class="tk" data-n="' + n + '" cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="17"/>';
    }
    box.innerHTML = s + taps + '</svg>';
    $('parRo').innerHTML = (st.mark ? 'มุม ★ = <b>' + pAngUI(st.mark, phi) + '°</b> · ' : '') + 'เส้นตัดเอียง ' + phi + '°' + (phi === 90 ? ' (ตั้งฉาก ทุกมุม = 90°)' : '') + (st.sel.length ? '\nแตะไว้: มุม ' + st.sel.slice().sort().join(', ') : '');
  }
  box.onclick = e => { if (o.locked && !o.m.free) return; const c = e.target.closest('[data-n]'); if (!c) return; const n = +c.dataset.n; if (n === st.mark) return; const k = st.sel.indexOf(n); if (k >= 0) st.sel.splice(k, 1); else st.sel.push(n); render(); o.onChange(); };
  const rg = el.querySelector('.rng'); if (rg) rg.oninput = () => { if (o.locked && !o.m.free) return; st.phi = +rg.value; render(); o.onChange(); };
  o.reveal = render; render();
};
function pAngUI(n, phi) { return n % 2 ? phi : 180 - phi; }
W.cube = (el, st, o) => {
  el.innerHTML = '<div class="cubev"></div><div class="cubec"></div><div class="readout" id="cubeRo"></div>';
  const view = el.children[0], ctl = el.children[1];
  function draw() {
    const { w, l, h } = st, gap = st.split ? 0.45 : 0, c30 = 0.866;
    const s = Math.min(34, 310 / ((w + l) * c30), 250 / ((w + l) * 0.5 + h * (1 + gap)));
    const P = (x, y, z, lay) => [(x - y) * s * c30, (x + y) * s * 0.5 - z * s - lay * gap * s];
    const minX = -l * s * c30, maxX = w * s * c30, minY = -h * s * (1 + gap), maxY = (w + l) * s * 0.5;
    const cubes = []; for (let z = 0; z < h; z++) for (let y = 0; y < l; y++) for (let x = 0; x < w; x++) cubes.push([x, y, z]);
    cubes.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]) || a[2] - b[2]);
    const pt = p => (p[0] - minX + 6).toFixed(1) + ',' + (p[1] - minY + 6).toFixed(1);
    let g = '';
    for (const [x, y, z] of cubes) {
      const L = z, top = [P(x, y, z + 1, L), P(x + 1, y, z + 1, L), P(x + 1, y + 1, z + 1, L), P(x, y + 1, z + 1, L)];
      const right = [P(x + 1, y, z, L), P(x + 1, y + 1, z, L), P(x + 1, y + 1, z + 1, L), P(x + 1, y, z + 1, L)];
      const left = [P(x, y + 1, z, L), P(x + 1, y + 1, z, L), P(x + 1, y + 1, z + 1, L), P(x, y + 1, z + 1, L)];
      g += '<polygon class="cbl" points="' + left.map(pt).join(' ') + '"/><polygon class="cbr" points="' + right.map(pt).join(' ') + '"/><polygon class="cbt" points="' + top.map(pt).join(' ') + '"/>';
    }
    view.innerHTML = '<svg viewBox="0 0 ' + (maxX - minX + 12).toFixed(0) + ' ' + (maxY - minY + 12).toFixed(0) + '" style="max-height:290px">' + g + '</svg>';
    const hide = st.lock && !o.locked, B = w * l;
    $('cubeRo').innerHTML = 'กว้าง ' + w + ' × ยาว ' + l + ' × สูง ' + h + (hide ? '' : '\nชั้นละ ' + w + ' × ' + l + ' = ' + B + ' ก้อน · มี ' + h + ' ชั้น\nปริมาตร = ' + B + ' × ' + h + ' = <b>' + (B * h) + '</b> ลูกบาศก์หน่วย');
  }
  function controls() {
    const ed = !st.lock && !(o.locked && !o.m.free);
    ctl.innerHTML = '<div class="zrow">' + (ed ? [['w', 'กว้าง'], ['l', 'ยาว'], ['h', 'สูง']].map(([k, n]) => '<span class="stp">' + n + ' <button data-k="' + k + '" data-d="-1" aria-label="ลด' + n + '">−</button><b>' + st[k] + '</b><button data-k="' + k + '" data-d="1" aria-label="เพิ่ม' + n + '">+</button></span>').join('') : '') +
      '<button class="ghost" data-split="1">' + (st.split ? '⬛ รวมชั้น' : '↕ แยกชั้น') + '</button></div>';
  }
  ctl.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.split) { st.split = !st.split; controls(); draw(); return; }
    if (st.lock || (o.locked && !o.m.free)) return;
    const k = b.dataset.k, v = st[k] + +b.dataset.d; if (v < 1 || v > 6) return; st[k] = v; controls(); draw(); o.onChange();
  };
  o.reveal = () => { controls(); draw(); };
  controls(); draw();
};
W.cards = (el, st, o) => {
  const canEdit = i => st.edit === 'all' || (Array.isArray(st.edit) && st.edit.includes(i));
  function render() {
    const R = st.r, C = st.c, showN = st.counts || o.locked;
    let h = '<div class="cards" style="grid-template-columns:repeat(' + C + ',1fr) 34px;max-width:' + (C * 54 + 40) + 'px">';
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) { const i = r * C + c, pc = (R > 1 && (r === R - 1 || c === C - 1)) || (R === 1 && c === C - 1);
        h += '<button class="cd' + (st.cells[i] ? ' on' : '') + (pc ? ' pc' : '') + (canEdit(i) && st.mode === 'flip' ? ' ed' : '') + (st.pick === i ? ' pk' : '') + ((st.mark || []).includes(i) ? ' mk' : '') + '" data-i="' + i + '" aria-label="การ์ด">' + st.cells[i] + '</button>'; }
      const k = rowCnt2(r); h += '<div class="cnt' + (showN && k % 2 ? ' odd' : '') + '">' + (showN ? k + (k % 2 ? ' คี่' : '') : '') + '</div>';
    }
    if (R > 1) { for (let c = 0; c < C; c++) { const k = colCnt2(c); h += '<div class="cnt' + (showN && k % 2 ? ' odd' : '') + '">' + (showN ? k + (k % 2 ? ' คี่' : '') : '') + '</div>'; } h += '<div></div>'; }
    el.innerHTML = h + '</div><div class="sub" style="margin:6px 0 0;text-align:center">' + (showN ? 'ตัวเลขท้ายแถว / ใต้คอลัมน์ = จำนวนการ์ดสี' : 'ลองนับการ์ดสีเองทีละแถว ทีละคอลัมน์') + ' · กรอบประ = การ์ดตรวจ</div>';
  }
  const rowCnt2 = r => { let k = 0; for (let c = 0; c < st.c; c++) k += st.cells[r * st.c + c]; return k; };
  const colCnt2 = c => { let k = 0; for (let r = 0; r < st.r; r++) k += st.cells[r * st.c + c]; return k; };
  el.onclick = e => { if (o.locked && !o.m.free) return; const b = e.target.closest('[data-i]'); if (!b) return; const i = +b.dataset.i;
    if (st.mode === 'pick') st.pick = i; else if (st.mode === 'flip' && canEdit(i)) st.cells[i] ^= 1; else return;
    render(); o.onChange(); };
  o.reveal = render; render();
};

/* ---------- เปลือกภารกิจ ---------- */
function paintHome() {
  const grp = (g, title) => '<h2>' + title + '</h2>' + G.LABS.filter(l => l.group === g).map(l => { const b = best(l.id), n = l.id === 'robot' ? 8 : l.id === 'quiz' ? 10 : 6;
    return '<button class="t" style="border-color:' + (g === 'num' ? 'var(--num)' : 'var(--code)') + '" data-id="' + l.id + '"><span class="best">' + (b ? '⭐ ' + b + '/' + n : '') + '</span><b>' + l.icon + ' ' + l.name + '</b><div class="d">' + l.sub + '</div></button>'; }).join('');
  $('labList').innerHTML = grp('num', '🔬 ห้องทดลองตัวเลข') + grp('code', '💻 โค้ด 0 กับ 1 (เลขฐานสอง · การเข้ารหัส · คำสั่ง)');
  document.querySelectorAll('#labList .t').forEach(b => b.onclick = () => openLab(G.LABS.find(l => l.id === b.dataset.id)));
}
function openLab(lab, missions) { LAB = lab; MS = missions || lab.round(); mi = 0; firstOk = 0; load(); show('lab'); }
function load() {
  M = MS[mi]; ST = G.clone(M.init); tries = 0; busy = false;
  $('lTitle').textContent = LAB.icon + ' ' + LAB.name;
  $('lProg').textContent = M.free ? 'เล่นอิสระ' : 'ภารกิจ ' + (mi + 1) + ' / ' + MS.length;
  $('lText').innerHTML = rich(M.text);
  $('lHint').innerHTML = ''; $('lHintBtn').classList.toggle('hidden', !M.hint); $('lHintBtn').disabled = false;
  $('lFb').innerHTML = ''; $('lAsk').innerHTML = ''; $('lNext').classList.add('hidden');
  OPT = { m: M, locked: false, onChange: () => { if (!OPT.locked) $('lFb').innerHTML = ''; }, busy: () => busy };
  W[M.kind]($('wbox'), ST, OPT);
  $('lCheck').textContent = M.kind === 'robot' ? '▶ รัน' : '✓ ตรวจ';
  $('lCheck').classList.toggle('hidden', !!(M.noCheck || M.free)); $('lCheck').disabled = false;
  $('lQuit').textContent = EMBED ? '✕ ปิด กลับไปทำข้อเดิม' : '← กลับ';
  if (M.noCheck) showAsk();
  window.scrollTo(0, 0);
}
function doCheck() {
  if (busy) return;
  const res = M.check(ST, tries + 1);
  if (M.kind === 'robot' && OPT.anim) { busy = true; $('lCheck').disabled = true; OPT.anim(res, () => { busy = false; $('lCheck').disabled = false; after(res); }); }
  else after(res);
}
function after(res) {
  if (!res.ok) { tries++; $('lFb').innerHTML = '<div class="fb bad">❌ ' + rich(res.msg) + '</div>'; return; }
  OPT.locked = true; $('lCheck').classList.add('hidden'); $('lHintBtn').classList.add('hidden');
  if (OPT.reveal) OPT.reveal(); if (OPT.rerender) OPT.rerender();
  if (M.ask) { $('lFb').innerHTML = '<div class="fb ok">✅ ใช่แล้ว! ตอบคำถามต่ออีกข้อ</div>'; showAsk(); }
  else success('');
}
function showAsk() {
  const a = M.ask, order = shuffle(a.c.map((_, k) => k));
  $('lAsk').innerHTML = '<div class="ask"><div class="q">' + rich(a.q) + '</div>' + order.map(k => '<button class="ch" data-k="' + k + '">' + rich(a.c[k]) + '</button>').join('') + '</div>';
  $('lAsk').querySelectorAll('.ch').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, right = k === 0;
    $('lAsk').querySelectorAll('.ch').forEach(x => { x.disabled = true; if (x.dataset.k === '0') x.classList.add('ok'); });
    if (!right) { tries++; b.classList.add('bad'); }
    OPT.locked = true; if (OPT.reveal) OPT.reveal();
    success(right ? '' : '❌ คำตอบคือ ' + a.c[0] + (a.why[a.c[k]] ? '\n🤔 ที่เลือก "' + a.c[k] + '" — ' + a.why[a.c[k]] : ''));
  });
}
function success(askMsg) {
  const first = tries === 0; if (first) firstOk++;
  const why = [].concat(...(M.why || []).map(l => l.split(' · '))).map((l, i) => (i + 1) + '. ' + l).join('\n');
  $('lFb').innerHTML = '<div class="fb ' + (askMsg ? 'bad' : 'ok') + '">' + (askMsg ? rich(askMsg) : (first ? '✅ เยี่ยม! ผ่านตั้งแต่ครั้งแรก' : '✅ ผ่านแล้ว!')) + (why ? '\n\n<b>ทำไมถึงเป็นแบบนี้</b>\n' + rich(why) : '') + '</div>';
  $('lNext').textContent = mi === MS.length - 1 ? (EMBED ? '✕ ปิด กลับไปทำข้อเดิม' : 'ดูผล 🎉') : 'ภารกิจต่อไป ➜';
  $('lNext').classList.remove('hidden');
  try { $('lNext').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { }
}
function next() { if (mi < MS.length - 1) { mi++; load(); } else if (EMBED) closeEmbed(); else finish(); }
function finish() {
  const n = MS.length, b = best(LAB.id); if (firstOk > b) setBest(LAB.id, firstOk);
  const p = firstOk / n;
  $('dTitle').textContent = LAB.icon + ' ' + LAB.name; $('dScore').textContent = firstOk + ' / ' + n;
  $('dStars').textContent = p >= 0.9 ? '⭐⭐⭐' : p >= 0.6 ? '⭐⭐' : p >= 0.3 ? '⭐' : '💪';
  $('dMsg').textContent = 'ผ่านตั้งแต่ครั้งแรก ' + firstOk + ' จาก ' + n + ' ภารกิจ' + (firstOk > b ? '\n🎉 สถิติใหม่!' : '') + '\n' + (p >= 0.8 ? 'เก่งมาก ลองห้องอื่นต่อเลย' : 'เล่นอีกรอบ ภารกิจจะสุ่มใหม่');
  show('done');
}
function closeEmbed() { try { if (parent && parent !== window && parent.closeLabOverlay) { parent.closeLabOverlay(); return; } } catch (e) { } history.back(); }
$('lCheck').onclick = doCheck;
$('lNext').onclick = next;
$('lHintBtn').onclick = () => { $('lHintBtn').disabled = true; $('lHint').innerHTML = '<div class="fb hint">💡 ' + rich(M.hint) + '</div>'; };
$('lQuit').onclick = () => { if (EMBED) return closeEmbed(); paintHome(); show('home'); };
$('dAgain').onclick = () => openLab(LAB);
$('dHome').onclick = () => { paintHome(); show('home'); };
/* ทางลัดสำหรับทดสอบอัตโนมัติ: ใส่สถานะที่ถูกแล้วกดตรวจ */
window.__lab = { solve() { if (M.free) return; if (M.solve) { ST = G.clone(M.solve()); W[M.kind]($('wbox'), ST, OPT); } if (!M.noCheck) doCheck(); }, state: () => ({ lab: LAB && LAB.id, mi, n: MS.length, firstOk, kind: M && M.kind }), open: id => openLab(G.LABS.find(l => l.id === id)) };
if (P.get('lab')) {
  const o = {}; P.forEach((v, k) => o[k] = v);
  const r = G.fromParams(o);
  if (r) { if (EMBED) document.querySelector('footer').classList.add('hidden'); openLab(r.lab, r.missions); } else paintHome();
} else paintHome();
})();
</script>
